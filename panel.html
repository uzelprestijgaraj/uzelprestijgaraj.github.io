<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yönetici Paneli | Uzel Prestij Garaj</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: #f5f5f5; color: #0A0A0A; }
.ust { background: #0A0A0A; color: #fff; padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; border-bottom: 3px solid #C9A961; }
.ust h1 { font-family: 'Playfair Display', serif; font-size: 22px; }
.ust h1 span { color: #C9A961; }
.ust button { background: transparent; color: #fff; border: 1px solid #C9A961; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; }
.ust button:hover { background: #C9A961; color: #0A0A0A; }

.icerik { max-width: 1200px; margin: 0 auto; padding: 32px; }
.sekmeler { display: flex; gap: 8px; margin-bottom: 32px; border-bottom: 2px solid #e0e0e0; }
.sekme { padding: 14px 28px; background: none; border: none; cursor: pointer; font-size: 14px; font-weight: 600; color: #666; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all 0.2s; font-family: inherit; }
.sekme.aktif { color: #0A0A0A; border-bottom-color: #C9A961; }
.sayfa { display: none; }
.sayfa.aktif { display: block; }

.kart { background: #fff; padding: 32px; border-radius: 4px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 24px; }
.kart h2 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee; }

.form-grup { margin-bottom: 20px; }
.form-grup label { display: block; font-size: 12px; font-weight: 600; color: #333; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
.form-grup input, .form-grup select, .form-grup textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #e0e0e0; border-radius: 4px; font-size: 14px; font-family: inherit; }
.form-grup input:focus, .form-grup select:focus, .form-grup textarea:focus { outline: none; border-color: #C9A961; }
.form-satir { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

.btn-gondur { background: #0A0A0A; color: #fff; padding: 14px 32px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
.btn-gondur:hover { background: #C9A961; color: #0A0A0A; }
.btn-gondur:disabled { opacity: 0.5; }
.btn-kirala-ver { background: #0ea5e9; color: #fff; }
.btn-kirala-ver:hover { background: #0284c7; color: #fff; }
.btn-iade-al { background: #22c55e; color: #fff; }
.btn-iade-al:hover { background: #16a34a; color: #fff; }

.liste { display: grid; gap: 16px; }
.liste-item { display: flex; gap: 20px; padding: 16px; background: #fafafa; border-radius: 4px; border-left: 3px solid #C9A961; align-items: center; }
.liste-item img { width: 100px; height: 70px; object-fit: cover; border-radius: 4px; }
.liste-item .bilgi { flex: 1; }
.liste-item h3 { font-size: 16px; margin-bottom: 4px; }
.liste-item p { font-size: 13px; color: #666; }
.sil-btn { background: #fee; color: #c00; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
.sil-btn:hover { background: #c00; color: #fff; }

.durum { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 700; letter-spacing: 0.5px; }
.durum-musait { background: #dcfce7; color: #166534; }
.durum-kirada { background: #fee2e2; color: #991b1b; }

.bildirim { position: fixed; bottom: 24px; right: 24px; padding: 16px 24px; background: #0A0A0A; color: #fff; border-radius: 4px; border-left: 4px solid #22c55e; display: none; z-index: 9999; }
.bildirim.goster { display: block; animation: kay 0.3s; }
.bildirim.hata { border-left-color: #ef4444; }
@keyframes kay { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 10000; padding: 20px; }
.modal.goster { display: flex; }
.modal-icerik { background: #fff; padding: 32px; border-radius: 8px; max-width: 500px; width: 100%; max-height: 90vh; overflow-y: auto; }
.modal-icerik h3 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee; }
.modal-butonlar { display: flex; gap: 12px; margin-top: 24px; }
.modal-butonlar button { flex: 1; padding: 14px; border: none; border-radius: 4px; font-size: 13px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-family: inherit; }
.modal-iptal { background: #f0f0f0; color: #666; }
.modal-iptal:hover { background: #e0e0e0; }

.hesap-kutu { background: #f8f8f8; padding: 16px; border-radius: 6px; margin: 16px 0; border-left: 4px solid #C9A961; }
.hesap-kutu p { margin: 6px 0; font-size: 14px; }
.hesap-kutu strong { color: #0A0A0A; }
.hesap-tutar { font-size: 24px !important; color: #c00 !important; font-weight: 700; }
</style>
</head>
<body>

<div class="ust">
  <h1>Uzel Prestij <span>Panel</span></h1>
  <button id="cikisBtn">Çıkış</button>
</div>

<div class="icerik">
  <div class="sekmeler">
    <button class="sekme aktif" data-sekme="araclar">🚗 Araçlar</button>
    <button class="sekme" data-sekme="ekle">➕ Araç Ekle</button>
    <button class="sekme" data-sekme="randevular">📅 Randevular</button>
    <button class="sekme" data-sekme="kiralamalar">🚙 Kiralamalar</button>
  </div>

  <div class="sayfa aktif" id="sayfa-araclar">
    <div class="kart">
      <h2>Mevcut Araçlar</h2>
      <div class="liste" id="aracListesi">
        <p style="color:#666;">Yükleniyor...</p>
      </div>
    </div>
  </div>

  <div class="sayfa" id="sayfa-ekle">
    <div class="kart">
      <h2>Yeni Araç Ekle</h2>
      <form id="aracForm">
        <div class="form-satir">
          <div class="form-grup"><label>Marka / Model</label><input type="text" id="marka" required placeholder="Fiat Egea"></div>
          <div class="form-grup"><label>Yıl</label><input type="number" id="yil" required placeholder="2021" min="2000" max="2030"></div>
        </div>
        <div class="form-satir">
          <div class="form-grup"><label>Vites</label>
            <select id="vites" required><option value="">Seçin</option><option>Manuel</option><option>Otomatik</option></select>
          </div>
          <div class="form-grup"><label>Yakıt</label>
            <select id="yakit" required><option value="">Seçin</option><option>Benzin</option><option>Dizel</option><option>LPG</option><option>Elektrik</option></select>
          </div>
        </div>
        <div class="form-satir">
          <div class="form-grup"><label>Günlük Fiyat (₺)</label><input type="number" id="fiyat" required placeholder="2000"></div>
          <div class="form-grup"><label>Koltuk Sayısı</label><input type="number" id="koltuk" value="5" required></div>
        </div>
        <div class="form-grup"><label>Mevcut KM</label><input type="number" id="km" required placeholder="45000"></div>
        <div class="form-grup"><label>Araç Fotoğrafı (Direkt Link)</label><input type="url" id="foto" required placeholder="https://i.ibb.co/xxxxx/foto.jpg"></div>
        <button type="submit" class="btn-gondur" id="ekleBtn">Aracı Ekle</button>
      </form>
    </div>
  </div>

  <div class="sayfa" id="sayfa-randevular">
    <div class="kart">
      <h2>Gelen Randevular</h2>
      <div class="liste" id="randevuListesi"><p style="color:#666;">Yükleniyor...</p></div>
    </div>
  </div>

  <div class="sayfa" id="sayfa-kiralamalar">
    <div class="kart">
      <h2>Kiralama Geçmişi</h2>
      <div class="liste" id="kiralamaListesi"><p style="color:#666;">Yükleniyor...</p></div>
    </div>
  </div>
</div>

<div class="bildirim" id="bildirim"></div>

<!-- KİRAYA VER MODAL -->
<div class="modal" id="kiralaModal">
  <div class="modal-icerik">
    <h3>🚙 Aracı Kiraya Ver</h3>
    <input type="hidden" id="kiralaAracId">
    <div class="form-grup"><label>Müşteri Adı</label><input type="text" id="k_musteri" required></div>
    <div class="form-grup"><label>Telefon</label><input type="tel" id="k_telefon" required placeholder="05XX XXX XX XX"></div>
    <div class="form-satir">
      <div class="form-grup"><label>Çıkış Tarihi</label><input type="date" id="k_cikis" required></div>
      <div class="form-grup"><label>İade Tarihi</label><input type="date" id="k_iade" required></div>
    </div>
    <div class="form-grup"><label>Çıkış KM</label><input type="number" id="k_cikis_km" required placeholder="45000"></div>
    <div class="modal-butonlar">
      <button class="modal-iptal" onclick="modalKapat()">İptal</button>
      <button class="btn-kirala-ver" onclick="aracKirala()">Kiraya Ver</button>
    </div>
  </div>
</div>

<!-- İADE AL MODAL -->
<div class="modal" id="iadeModal">
  <div class="modal-icerik">
    <h3>✅ Aracı İade Al</h3>
    <input type="hidden" id="iadeKiralamaId">
    <input type="hidden" id="iadeAracId">
    <input type="hidden" id="iadeCikisKm">
    <input type="hidden" id="iadeBaslangicTarih">
    <div class="form-grup"><label>Dönüş KM</label><input type="number" id="i_donus_km" required placeholder="45500"></div>
    <div id="hesapOnizleme" class="hesap-kutu" style="display:none;"></div>
    <div class="modal-butonlar">
      <button class="modal-iptal" onclick="iadeModalKapat()">İptal</button>
      <button class="btn-iade-al" onclick="aracIadeAl()">İade Al</button>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
const GUNLUK_LIMIT = 200;
const ASIM_UCRETI = 5;

auth.onAuthStateChanged(user => { if (!user) window.location.href = 'giris.html'; });
document.getElementById('cikisBtn').addEventListener('click', () => { auth.signOut().then(() => window.location.href = 'giris.html'); });

document.querySelectorAll('.sekme').forEach(sekme => {
  sekme.addEventListener('click', () => {
    document.querySelectorAll('.sekme').forEach(s => s.classList.remove('aktif'));
    document.querySelectorAll('.sayfa').forEach(s => s.classList.remove('aktif'));
    sekme.classList.add('aktif');
    document.getElementById('sayfa-' + sekme.dataset.sekme).classList.add('aktif');
  });
});

function bildir(mesaj, hata = false) {
  const b = document.getElementById('bildirim');
  b.textContent = mesaj;
  b.className = 'bildirim goster' + (hata ? ' hata' : '');
  setTimeout(() => b.classList.remove('goster'), 3000);
}

// ARAÇ EKLE
document.getElementById('aracForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('ekleBtn');
  btn.disabled = true; btn.textContent = 'Yükleniyor...';
  try {
    const fotoURL = document.getElementById('foto').value;
    await db.collection('araclar').add({
      marka: document.getElementById('marka').value,
      yil: parseInt(document.getElementById('yil').value),
      vites: document.getElementById('vites').value,
      yakit: document.getElementById('yakit').value,
      fiyat: parseInt(document.getElementById('fiyat').value),
      koltuk: parseInt(document.getElementById('koltuk').value),
      km: parseInt(document.getElementById('km').value),
      foto: fotoURL,
      durum: 'musait',
      tarih: firebase.firestore.FieldValue.serverTimestamp()
    });
    bildir('✅ Araç eklendi!');
    document.getElementById('aracForm').reset();
    araclariYukle();
    document.querySelector('[data-sekme="araclar"]').click();
  } catch (err) { bildir('❌ Hata: ' + err.message, true); }
  btn.disabled = false; btn.textContent = 'Aracı Ekle';
});

// ARAÇLARI YÜKLE
async function araclariYukle() {
  const liste = document.getElementById('aracListesi');
  try {
    const snap = await db.collection('araclar').orderBy('tarih', 'desc').get();
    if (snap.empty) { liste.innerHTML = '<p style="color:#666;">Henüz araç eklenmemiş.</p>'; return; }
    liste.innerHTML = '';
    snap.forEach(doc => {
      const a = doc.data();
      const div = document.createElement('div');
      div.className = 'liste-item';
      const durumClass = a.durum === 'kirada' ? 'durum-kirada' : 'durum-musait';
      const durumText = a.durum === 'kirada' ? 'KİRADA' : 'MÜSAİT';
      div.innerHTML = `
        <img src="${a.foto}" alt="${a.marka}">
        <div class="bilgi">
          <h3>${a.marka} (${a.yil}) <span class="durum ${durumClass}">${durumText}</span></h3>
          <p>${a.vites} · ${a.yakit} · ${a.koltuk} kişi · ${a.km ? a.km.toLocaleString('tr-TR') + ' km' : 'KM yok'}</p>
          <p style="color:#C9A961;font-weight:700;font-size:15px;margin-top:4px;">${a.fiyat.toLocaleString('tr-TR')} ₺/gün</p>
        </div>
        <div style="display:flex;gap:8px;flex-direction:column;">
          ${a.durum === 'kirada' ? 
            `<button class="btn-gondur btn-iade-al" style="padding:10px 16px;font-size:11px;" onclick="iadeModalAc('${doc.id}')">İADE AL</button>` :
            `<button class="btn-gondur btn-kirala-ver" style="padding:10px 16px;font-size:11px;" onclick="kiralaModalAc('${doc.id}', ${a.km || 0})">KİRAYA VER</button>`
          }
          <button class="sil-btn" data-id="${doc.id}">Sil</button>
        </div>
      `;
      div.querySelector('.sil-btn').addEventListener('click', async () => {
        if (confirm('Bu aracı silmek istediğinize emin misiniz?')) {
          await db.collection('araclar').doc(doc.id).delete();
          bildir('🗑️ Araç silindi');
          araclariYukle();
        }
      });
      liste.appendChild(div);
    });
  } catch (err) { liste.innerHTML = '<p style="color:#c00;">Hata: ' + err.message + '</p>'; }
}

// KİRAYA VER MODAL
function kiralaModalAc(aracId, mevcutKm) {
  document.getElementById('kiralaAracId').value = aracId;
  document.getElementById('k_cikis_km').value = mevcutKm || '';
  const bugun = new Date().toISOString().split('T')[0];
  document.getElementById('k_cikis').value = bugun;
  document.getElementById('kiralaModal').classList.add('goster');
}

function modalKapat() { document.getElementById('kiralaModal').classList.remove('goster'); }

async function aracKirala() {
  const aracId = document.getElementById('kiralaAracId').value;
  const musteri = document.getElementById('k_musteri').value;
  const telefon = document.getElementById('k_telefon').value;
  const cikis = document.getElementById('k_cikis').value;
  const iade = document.getElementById('k_iade').value;
  const cikisKm = parseInt(document.getElementById('k_cikis_km').value);

  if (!musteri || !telefon || !cikis || !iade || !cikisKm) {
    bildir('Lütfen tüm alanları doldurun', true); return;
  }

  try {
    await db.collection('kiralamalar').add({
      aracId, musteri, telefon, cikis, iade, cikisKm,
      durum: 'kirada',
      tarih: firebase.firestore.FieldValue.serverTimestamp()
    });
    await db.collection('araclar').doc(aracId).update({ durum: 'kirada' });
    bildir('✅ Araç kiraya verildi');
    modalKapat();
    araclariYukle();
    kiralamalariYukle();
  } catch (err) { bildir('❌ Hata: ' + err.message, true); }
}

// İADE AL MODAL
async function iadeModalAc(aracId) {
  const kSnap = await db.collection('kiralamalar')
    .where('aracId', '==', aracId)
    .where('durum', '==', 'kirada')
    .limit(1).get();
  
  if (kSnap.empty) { bildir('Aktif kiralama bulunamadı', true); return; }
  
  const k = kSnap.docs[0].data();
  document.getElementById('iadeKiralamaId').value = kSnap.docs[0].id;
  document.getElementById('iadeAracId').value = aracId;
  document.getElementById('iadeCikisKm').value = k.cikisKm;
  document.getElementById('iadeBaslangicTarih').value = k.cikis;
  document.getElementById('i_donus_km').value = '';
  document.getElementById('hesapOnizleme').style.display = 'none';
  document.getElementById('iadeModal').classList.add('goster');
}

function iadeModalKapat() { document.getElementById('iadeModal').classList.remove('goster'); }

document.getElementById('i_donus_km').addEventListener('input', () => {
  const cikisKm = parseInt(document.getElementById('iadeCikisKm').value) || 0;
  const donusKm = parseInt(document.getElementById('i_donus_km').value) || 0;
  const cikisTarih = new Date(document.getElementById('iadeBaslangicTarih').value);
  const bugun = new Date();
  const gunSayisi = Math.max(1, Math.ceil((bugun - cikisTarih) / (1000 * 60 * 60 * 24)));
  
  const toplamKm = donusKm - cikisKm;
  const limit = gunSayisi * GUNLUK_LIMIT;
  const asim = Math.max(0, toplamKm - limit);
  const ucret = asim * ASIM_UCRETI;
  
  const kutu = document.getElementById('hesapOnizleme');
  kutu.style.display = 'block';
  kutu.innerHTML = `
    <p>📅 <strong>Kiralama süresi:</strong> ${gunSayisi} gün</p>
    <p>🛣️ <strong>Toplam KM:</strong> ${toplamKm} km</p>
    <p>📊 <strong>Limit:</strong> ${limit} km</p>
    <p>⚠️ <strong>Aşım:</strong> ${asim} km</p>
    <p class="hesap-tutar">💰 Ek Ücret: ${ucret.toLocaleString('tr-TR')} ₺</p>
  `;
});

async function aracIadeAl() {
  const kiralamaId = document.getElementById('iadeKiralamaId').value;
  const aracId = document.getElementById('iadeAracId').value;
  const cikisKm = parseInt(document.getElementById('iadeCikisKm').value);
  const donusKm = parseInt(document.getElementById('i_donus_km').value);
  const cikisTarih = new Date(document.getElementById('iadeBaslangicTarih').value);
  const bugun = new Date();
  const gunSayisi = Math.max(1, Math.ceil((bugun - cikisTarih) / (1000 * 60 * 60 * 24)));
  
  const toplamKm = donusKm - cikisKm;
  const limit = gunSayisi * GUNLUK_LIMIT;
  const asim = Math.max(0, toplamKm - limit);
  const ucret = asim * ASIM_UCRETI;

  if (!donusKm || donusKm < cikisKm) {
    bildir('Geçerli bir dönüş KM girin', true); return;
  }

  try {
    await db.collection('kiralamalar').doc(kiralamaId).update({
      donusKm, toplamKm, gunSayisi, asim, ekUcret: ucret,
      iadeTarihi: bugun.toISOString().split('T')[0],
      durum: 'tamamlandi'
    });
    await db.collection('araclar').doc(aracId).update({ durum: 'musait', km: donusKm });
    bildir(`✅ İade alındı. Ek ücret: ${ucret.toLocaleString('tr-TR')} ₺`);
    iadeModalKapat();
    araclariYukle();
    kiralamalariYukle();
  } catch (err) { bildir('❌ Hata: ' + err.message, true); }
}

// KİRALAMALARI YÜKLE
async function kiralamalariYukle() {
  const liste = document.getElementById('kiralamaListesi');
  try {
    const snap = await db.collection('kiralamalar').orderBy('tarih', 'desc').get();
    if (snap.empty) { liste.innerHTML = '<p style="color:#666;">Henüz kiralama yok.</p>'; return; }
    liste.innerHTML = '';
    snap.forEach(doc => {
      const k = doc.data();
      const div = document.createElement('div');
      div.className = 'liste-item';
      div.innerHTML = `
        <div class="bilgi">
          <h3>${k.musteri} <span class="durum ${k.durum === 'kirada' ? 'durum-kirada' : 'durum-musait'}">${k.durum === 'kirada' ? 'KİRADA' : 'TAMAMLANDI'}</span></h3>
          <p>📞 ${k.telefon}</p>
          <p>📅 ${k.cikis} → ${k.iadeTarihi || k.iade}</p>
          <p>🛣️ Çıkış: ${k.cikisKm.toLocaleString('tr-TR')} km${k.donusKm ? ' · Dönüş: ' + k.donusKm.toLocaleString('tr-TR') + ' km' : ''}</p>
          ${k.toplamKm ? `<p>📊 Toplam: ${k.toplamKm} km (${k.gunSayisi} gün) · Aşım: ${k.asim} km</p>` : ''}
          ${k.ekUcret ? `<p style="color:#c00;font-weight:700;">💰 Ek Ücret: ${k.ekUcret.toLocaleString('tr-TR')} ₺</p>` : ''}
        </div>
      `;
      liste.appendChild(div);
    });
  } catch (err) { liste.innerHTML = '<p style="color:#c00;">Hata: ' + err.message + '</p>'; }
}

// RANDEVULARI YÜKLE
async function randevulariYukle() {
  const liste = document.getElementById('randevuListesi');
  try {
    const snap = await db.collection('randevular').orderBy('tarih', 'desc').get();
    if (snap.empty) { liste.innerHTML = '<p style="color:#666;">Henüz randevu yok.</p>'; return; }
    liste.innerHTML = '';
    snap.forEach(doc => {
      const r = doc.data();
      const div = document.createElement('div');
      div.className = 'liste-item';
      const tip = r.tip === 'kiralama' ? '🚗 Kiralama' : '✨ Yıkama/Tamir';
      div.innerHTML = `
        <div class="bilgi">
          <h3>${r.ad || 'İsimsiz'} <small style="color:#C9A961;">${tip}</small></h3>
          <p>📞 ${r.telefon || '-'}</p>
          ${r.arac ? `<p>🚗 ${r.arac}</p>` : ''}
          ${r.hizmet ? `<p>🔧 ${r.hizmet}</p>` : ''}
          ${r.baslangic ? `<p>📅 ${r.baslangic} → ${r.bitis || '-'}</p>` : ''}
          ${r.tarih && !r.baslangic ? `<p>📅 ${r.tarih} ${r.saat || ''}</p>` : ''}
          ${r.not ? `<p>📝 ${r.not}</p>` : ''}
        </div>
        <button class="sil-btn" data-id="${doc.id}">Sil</button>
      `;
      div.querySelector('.sil-btn').addEventListener('click', async () => {
        if (confirm('Randevuyu sil?')) {
          await db.collection('randevular').doc(doc.id).delete();
          bildir('🗑️ Silindi'); randevulariYukle();
        }
      });
      liste.appendChild(div);
    });
  } catch (err) { liste.innerHTML = '<p style="color:#c00;">Hata: ' + err.message + '</p>'; }
}

window.addEventListener('load', () => {
  araclariYukle();
  randevulariYukle();
  kiralamalariYukle();
});
</script>
</body>
</html>
