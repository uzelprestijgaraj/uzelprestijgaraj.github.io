<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0f1e">
  <title>Yönetici Girişi | Uzel Prestij Garaj</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      place-items: center;
      background: #0a0f1e;
      color: #111827;
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(0, 0, 0, .35);
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      color: #111827;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .brand-logo {
      display: grid;
      width: 44px;
      height: 44px;
      flex: 0 0 44px;
      place-items: center;
      border-radius: 50%;
      background: #f59e0b;
      color: #fff;
      font-size: 24px;
      font-weight: 800;
    }

    h1 {
      margin: 0 0 26px;
      color: #111827;
      font-size: 24px;
      text-align: center;
    }

    .field { margin-bottom: 18px; }

    label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      min-height: 48px;
      padding: 11px 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      color: #111827;
      font: inherit;
    }

    input:focus {
      border-color: #f59e0b;
      outline: 3px solid rgba(245, 158, 11, .2);
    }

    #girisButon {
      width: 100%;
      min-height: 48px;
      margin-top: 4px;
      border: 0;
      border-radius: 8px;
      background: #f59e0b;
      color: #111827;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    #girisButon:hover { background: #fbbf24; }

    #sifremiUnuttum {
      display: block;
      margin-top: 20px;
      color: #8a5a00;
      font-size: 14px;
      text-align: center;
      text-decoration: none;
    }

    #sifremiUnuttum:hover { text-decoration: underline; }

    #mesaj {
      display: none;
      margin: 16px 0 0;
      color: #b42318;
      font-size: 14px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-card { padding: 32px 24px; }
      .brand { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="login-card">
    <div class="brand">
      <span class="brand-logo" aria-hidden="true">U</span>
      <span>UZEL PRESTİJ GARAJ</span>
    </div>
    <h1>Yönetici Girişi</h1>
    <div class="field">
      <label for="email">E-posta</label>
      <input id="email" type="email" autocomplete="username">
    </div>
    <div class="field">
      <label for="password">Şifre</label>
      <input id="password" type="password" autocomplete="current-password">
    </div>
    <button id="girisButon" type="button">GİRİŞ YAP</button>
    <a id="sifremiUnuttum" href="#">Şifremi unuttum</a>
    <p id="mesaj" role="alert"></p>
  </main>

  <script src="firebase-config.js"></script>
  <script>
    {
      const auth = firebase.auth();
      
      const girisButon = document.getElementById('girisButon');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const mesaj = document.getElementById('mesaj');
      
      girisButon.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        
        if (!email || !password) {
          mesaj.textContent = 'E-posta ve şifre gerekli.';
          mesaj.style.display = 'block';
          return;
        }
        
        try {
          await auth.signInWithEmailAndPassword(email, password);
          localStorage.setItem('girisYapildi', 'true');
          window.location.href = 'panel.html';
        } catch (error) {
          console.error('Firebase giriş hatası:', error);
          mesaj.textContent = 'Giriş başarısız. E-posta veya şifre hatalı.';
          mesaj.style.display = 'block';
        }
      });
    }
  </script>
</body>
</html>
