<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Randevu Al | Uzel Prestij Garaj</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Inter', sans-serif;
  background: #FAF8F3;
  color: #0A0A0A;
  min-height: 100vh;
}
.ust {
  background: #0A0A0A;
  color: #fff;
  padding: 20px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 3px solid #C9A961;
}
.ust a {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: #fff;
  text-decoration: none;
  letter-spacing: 2px;
}
.ust a span { color: #C9A961; }
.geri {
  color: #fff;
  text-decoration: none;
  font-size: 13px;
  letter-spacing: 1px;
  text-transform: uppercase;
  border: 1px solid #C9A961;
  padding: 8px 18px;
  border-radius: 4px;
}
.geri:hover { background: #C9A961; color: #0A0A0A; }

.kapsayici {
  max-width: 900px;
  margin: 0 auto;
  padding: 60px 24px;
}
.baslik {
  text-align: center;
  margin-bottom: 48px;
}
.baslik h1 {
  font-family: 'Playfair Display', serif;
  font-size: 42px;
  margin-bottom: 12px;
}
.baslik p { color: #666; font-size: 16px; }

.sekmeler {
  display: flex;
  gap: 8px;
  margin-bottom: 32px;
  background: #fff;
  padding: 8px;
  border-radius: 8px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.06);
}
.sekme {
  flex: 1;
  padding: 16px;
  background: none;
  border: none;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  color: #666;
  border-radius: 6px;
  transition: all 0.2s;
  font-family: inherit;
}
.sekme.aktif { background: #0A0A0A; color: #fff; }

.form-kart {
  background: #fff;
  padding: 40px;
  border-radius: 8px;
  box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  border-top: 4px solid #C9A961;
}
.form-kart h2 {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  margin-bottom: 28px;
}
.form-satir {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}
.grup { margin-bottom: 20px; }
.grup label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #333;
  margin-bottom: 8px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
.grup input, .grup select, .grup textarea {
  width: 100%;
  padding: 14px 16px;
  border: 1.5px solid #e0e0e0;
  border-radius: 6px;
  font-size: 15px;
  font-family: inherit;
  transition: border-color 0.2s;
}
.grup input:focus, .grup select:focus, .grup textarea:focus {
  outline: none;
  border-color: #C9A961;
}

.btn-wa {
  width: 100%;
  padding: 18px;
  background: #25D366;
  color: #fff;
  border: none;
  border-radius: 6px;
  font-size: 15px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  cursor: pointer;
  font-family: inherit;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  transition: all 0.2s;
}
.btn-wa:hover { background: #1da851; transform: translateY(-2px); }
.btn-wa svg { width: 22px; height: 22px; }

.gizli { display: none; }

@media (max-width: 640px) {
  .form-satir { grid-template-columns: 1fr; }
  .baslik h1 { font-size: 30px; }
  .form-kart { padding: 28px 20px; }
  .sekme { font-size: 13px; padding: 12px 8px; }
}
</style>
  <!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-2H0L1CV0JZ"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-2H0L1CV0JZ');
</script>
</head>
<body>

<div class="ust">
  <a href="/">UZEL PRESTİJ <span>GARAJ</span></a>
  <a href="/" class="geri">← Geri</a>
</div>

<div class="kapsayici">
  <div class="baslik">
    <h1>Randevu Al</h1>
    <p>Formu doldurun, WhatsApp ile bize iletin</p>
  </div>

  <div class="sekmeler">
    <button class="sekme aktif" data-form="kiralama">🚗 Araç Kiralama</button>
    <button class="sekme" data-form="yikama">✨ Yıkama / Tamir</button>
  </div>

  <!-- KİRALAMA FORMU -->
  <form class="form-kart" id="form-kiralama">
    <h2>Araç Kiralama Randevusu</h2>
    
    <div class="form-satir">
      <div class="grup">
        <label>Ad Soyad</label>
        <input type="text" id="k_ad" required placeholder="Adınız Soyadınız">
      </div>
      <div class="grup">
        <label>Telefon</label>
        <input type="tel" id="k_tel" required placeholder="05XX XXX XX XX">
      </div>
    </div>

    <div class="grup">
      <label>Araç Seçimi</label>
      <select id="k_arac" required>
        <option value="">Araç Seçin</option>
        <option>Fiat Egea (2021) — 2.000 ₺/gün</option>
        <option>Renault Symbol (2021) — 1.800 ₺/gün</option>
        <option>Dacia Duster (2024) — 2.300 ₺/gün</option>
      </select>
    </div>

    <div class="form-satir">
      <div class="grup">
        <label>Başlangıç Tarihi</label>
        <input type="date" id="k_bas" required>
      </div>
      <div class="grup">
        <label>Bitiş Tarihi</label>
        <input type="date" id="k_bit" required>
      </div>
    </div>

    <div class="grup">
      <label>Not (İsteğe Bağlı)</label>
      <textarea id="k_not" rows="3" placeholder="Eklemek istediğiniz not..."></textarea>
    </div>

    <button type="submit" class="btn-wa">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp ile Gönder
    </button>
  </form>

  <!-- YIKAMA / TAMİR FORMU -->
  <form class="form-kart gizli" id="form-yikama">
    <h2>Yıkama / Tamir Randevusu</h2>
    
    <div class="form-satir">
      <div class="grup">
        <label>Ad Soyad</label>
        <input type="text" id="y_ad" required placeholder="Adınız Soyadınız">
      </div>
      <div class="grup">
        <label>Telefon</label>
        <input type="tel" id="y_tel" required placeholder="05XX XXX XX XX">
      </div>
    </div>

    <div class="form-satir">
      <div class="grup">
        <label>Hizmet</label>
        <select id="y_hizmet" required>
          <option value="">Seçin</option>
          <option>Oto Yıkama (İç-Dış Detaylı)</option>
          <option>Pasta-Cila</option>
          <option>Motor Yıkama</option>
          <option>Periyodik Bakım</option>
          <option>Motor Tamiri</option>
          <option>Fren Bakımı</option>
          <option>Diğer</option>
        </select>
      </div>
      <div class="grup">
        <label>Araç Modeli</label>
        <input type="text" id="y_model" required placeholder="Örn: Fiat Egea 2020">
      </div>
    </div>

    <div class="form-satir">
      <div class="grup">
        <label>Tarih</label>
        <input type="date" id="y_tarih" required>
      </div>
      <div class="grup">
        <label>Saat</label>
        <input type="time" id="y_saat" required>
      </div>
    </div>

    <div class="grup">
      <label>Not (İsteğe Bağlı)</label>
      <textarea id="y_not" rows="3" placeholder="Eklemek istediğiniz not..."></textarea>
    </div>

    <button type="submit" class="btn-wa">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      WhatsApp ile Gönder
    </button>
  </form>
</div>

<script>
// Sekme geçişi
document.querySelectorAll('.sekme').forEach(sekme => {
  sekme.addEventListener('click', () => {
    document.querySelectorAll('.sekme').forEach(s => s.classList.remove('aktif'));
    sekme.classList.add('aktif');
    document.querySelectorAll('.form-kart').forEach(f => f.classList.add('gizli'));
    document.getElementById('form-' + sekme.dataset.form).classList.remove('gizli');
  });
});

// Telefon numarası
const TEL = '905395253091';

// Kiralama formu
document.getElementById('form-kiralama').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mesaj = `🚗 *ARAÇ KİRALAMA RANDEVUSU*%0A%0A` +
    `👤 *Ad Soyad:* ${document.getElementById('k_ad').value}%0A` +
    `📞 *Telefon:* ${document.getElementById('k_tel').value}%0A` +
    `🚙 *Araç:* ${document.getElementById('k_arac').value}%0A` +
    `📅 *Başlangıç:* ${document.getElementById('k_bas').value}%0A` +
    `📅 *Bitiş:* ${document.getElementById('k_bit').value}%0A` +
    `📝 *Not:* ${document.getElementById('k_not').value || '-'}`;
  
  await db.collection('randevular').add({
  tip: 'kiralama',
  ad: document.getElementById('k_ad').value,
  telefon: document.getElementById('k_tel').value,
  arac: document.getElementById('k_arac').value,
  baslangic: document.getElementById('k_bas').value,
  bitis: document.getElementById('k_bit').value,
  not: document.getElementById('k_not').value,
  tarih: firebase.firestore.FieldValue.serverTimestamp(),
  durum: 'beklemede'
});

window.open(`https://wa.me/${TEL}?text=${mesaj}`, '_blank');
});

// Yıkama/Tamir formu
document.getElementById('form-yikama').addEventListener('submit', async (e) => {
  e.preventDefault();
  const mesaj = `✨ *YIKAMA / TAMİR RANDEVUSU*%0A%0A` +
    `👤 *Ad Soyad:* ${document.getElementById('y_ad').value}%0A` +
    `📞 *Telefon:* ${document.getElementById('y_tel').value}%0A` +
    `🔧 *Hizmet:* ${document.getElementById('y_hizmet').value}%0A` +
    `🚗 *Araç:* ${document.getElementById('y_model').value}%0A` +
    `📅 *Tarih:* ${document.getElementById('y_tarih').value}%0A` +
    `🕐 *Saat:* ${document.getElementById('y_saat').value}%0A` +
    `📝 *Not:* ${document.getElementById('y_not').value || '-'}`;
  
  await db.collection('randevular').add({
  tip: 'yikama',
  ad: document.getElementById('y_ad').value,
  telefon: document.getElementById('y_tel').value,
  hizmet: document.getElementById('y_hizmet').value,
  arac: document.getElementById('y_model').value,
  tarih: document.getElementById('y_tarih').value,
  saat: document.getElementById('y_saat').value,
  not: document.getElementById('y_not').value,
  tarih: firebase.firestore.FieldValue.serverTimestamp(),
  durum: 'beklemede'
});

window.open(`https://wa.me/${TEL}?text=${mesaj}`, '_blank');
});
</script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
</body>
</html>
